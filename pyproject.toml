[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microworld-mot"
version = "0.1.0"
description = "Tiny probabilistic object-world model for counterfactual multi-object tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
perception = ["ultralytics>=8.3,<9", "Pillow>=9"]
evaluation = ["motmetrics>=1.4"]
datasets = ["gdown>=5.2", "Pillow>=9"]

[project.scripts]
microworld-train = "microworld_mot.cli:train_main"
microworld-eval = "microworld_mot.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
